<svg xmlns="http://www.w3.org/2000/svg" width="820" height="505"><rect width="100%" height="100%" rx="12" fill="#101827"/><rect width="100%" height="40" fill="#293347"/><text x="20" y="26" fill="white" font-family="monospace" font-size="15">Terminal — Zahlenraten</text><text x="20" y="68" fill="#a7f3d0" font-family="monospace" font-size="15">Zahlenraten: 1 - Ein Spieler, 2 - Zwei Spieler, 3 - Beenden</text><text x="20" y="90" fill="#a7f3d0" font-family="monospace" font-size="15">1</text><text x="20" y="112" fill="#a7f3d0" font-family="monospace" font-size="15">Geben Sie den Namen des Spielers ein :</text><text x="20" y="134" fill="#a7f3d0" font-family="monospace" font-size="15">Aziz</text><text x="20" y="156" fill="#a7f3d0" font-family="monospace" font-size="15">Runde 1 :</text><text x="20" y="178" fill="#a7f3d0" font-family="monospace" font-size="15">Die Zahlen sind 11 und 78</text><text x="20" y="200" fill="#a7f3d0" font-family="monospace" font-size="15">Aziz ist an der Reihe:</text><text x="20" y="222" fill="#a7f3d0" font-family="monospace" font-size="15">Wählen Sie aus. Die nächste Zahl ist ...</text><text x="20" y="244" fill="#a7f3d0" font-family="monospace" font-size="15">0: kleiner als 11 .</text><text x="20" y="266" fill="#a7f3d0" font-family="monospace" font-size="15">1: genau 11 .</text><text x="20" y="288" fill="#a7f3d0" font-family="monospace" font-size="15">2: zwischen 11 und 78 .</text><text x="20" y="310" fill="#a7f3d0" font-family="monospace" font-size="15">3: genau 78 .</text><text x="20" y="332" fill="#a7f3d0" font-family="monospace" font-size="15">4: größer als 78 .</text><text x="20" y="354" fill="#a7f3d0" font-family="monospace" font-size="15">0</text><text x="20" y="376" fill="#a7f3d0" font-family="monospace" font-size="15">Computer ist an der Reihe:</text><text x="20" y="398" fill="#a7f3d0" font-family="monospace" font-size="15">Die Auswahl des Computers ist 3</text><text x="20" y="420" fill="#a7f3d0" font-family="monospace" font-size="15">Die dritte zahl leutet 28</text><text x="20" y="442" fill="#a7f3d0" font-family="monospace" font-size="15">Der aktuelle Punktestand lautet:</text><text x="20" y="464" fill="#a7f3d0" font-family="monospace" font-size="15">Aziz : 0 Punkte</text><text x="20" y="486" fill="#a7f3d0" font-family="monospace" font-size="15">Computer : 0 Punkte</text></svg>